name: Build PaperScan Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate a matching Android platform scaffold without touching lib/ or pubspec.yaml.
      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.example --project-name paper_scan_pro /tmp/paper_scan_android
          rm -rf android
          cp -R /tmp/paper_scan_android/android ./android
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts || true
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/' android/app/build.gradle || true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaperScan-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
