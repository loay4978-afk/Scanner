name: Build PaperScan Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and extract App.zip
        run: |
          test -f App.zip
          mkdir -p app_source
          unzip -q App.zip -d app_source
          test -f app_source/pubspec.yaml
          test -d app_source/lib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        working-directory: app_source
        run: |
          flutter create --platforms=android --org com.example --project-name paper_scan_pro .
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts || true
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/' android/app/build.gradle || true

      - name: Resolve dependencies
        working-directory: app_source
        run: flutter pub get

      - name: Build release APK
        working-directory: app_source
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaperScan-Pro-APK
          path: app_source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
